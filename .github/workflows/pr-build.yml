name: Go build


on:
  push:
    branches: [ NewArc ]
  pull_request:
    branches: [ NewArc ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go 1.x
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.2
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Get dependencies
        run: go mod download
      - name: Build
        run: |
          cd cmd/elasticindexer 
          go build
